# Wan2.2 T2V-A14B: strict quantized self-attention, float cross-attention.
# Empty fallback makes unsupported hardware fail visibly during qualification.
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    diffusion_attention_config:
      per_role:
        self:
          backend: RAINFUSION_ATTN
          block_sparse:
            sparsity: 0.8
          quant:
            method: fp8
            fallback: []
            skip_layers: "0,39"
            skip_steps: "0,49"
        cross:
          backend: FLASH_ATTN
          quant:
            method: float
