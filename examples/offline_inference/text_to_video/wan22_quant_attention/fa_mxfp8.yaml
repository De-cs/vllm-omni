# Wan2.2 T2V-A14B: use --num-inference-steps 40 with these fixed step indices.
# Empty fallback makes unsupported hardware fail visibly during qualification.
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    diffusion_kv_cache_skip_steps: "0,1,38,39"
    diffusion_kv_cache_skip_layers: "0,39"
    diffusion_attention_config:
      per_role:
        self:
          backend: FLASH_ATTN
          quant:
            method: mxfp8
            fallback: []
        cross:
          backend: FLASH_ATTN
          quant:
            method: float
